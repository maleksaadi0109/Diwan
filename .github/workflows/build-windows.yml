name: Build Windows Executable (.exe)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/arabic-poetry/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm --filter @workspace/arabic-poetry run build

      - name: Build Tauri Windows Executable (.exe / .msi)
        run: pnpm --filter @workspace/arabic-poetry tauri build

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Diwan-Windows-Exe
          path: |
            artifacts/arabic-poetry/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/arabic-poetry/src-tauri/target/release/bundle/msi/*.msi
            artifacts/arabic-poetry/src-tauri/target/release/diwan.exe
          if-no-files-found: warn
