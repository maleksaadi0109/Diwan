kind = "web"
previewPath = "/"
title = "Arabic Poetry Desktop"
description = "A desktop-inspired Arabic poetry reader that imports poems, synchronizes recitations with verses, and provides classical explanations."
version = "1.0.0"
id = "artifacts/arabic-poetry"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23461

[services.development]
run = "pnpm --filter @workspace/arabic-poetry run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arabic-poetry", "run", "build" ]
serve = "static"
publicDir = "artifacts/arabic-poetry/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23461"
BASE_PATH = "/"
