kind = "mobile"
previewPath = "/mobile/"
title = "ديوان - Mobile"
description = "A mobile companion app for the Arabic Poetry desktop app. Lets users browse a library of Arabic poems, play synced audio recitation with verse-by-verse highlighting, import new poems (YouTube audio + transcription/alignment via the shared api-server backend), and share verses as styled images on WhatsApp/Telegram."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
